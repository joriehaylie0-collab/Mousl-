<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غرفة المتابعة الحية - مراقبة الكباتن</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; }
    body {
      margin: 0;
      background: #0b1120;
      color: #f1f5f9;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }
    header {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title-group h1 { margin: 0; font-size: 1.15rem; color: #38bdf8; }
    .title-group small { color: #94a3b8; font-size: 0.82rem; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    button, select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button.primary { background: #0284c7; border-color: #0284c7; font-weight: 700; }
    .main {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 0;
    }
    @media (max-width: 820px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 46vh 54vh; }
    }
    .sidebar {
      background: #0f172a;
      border-left: 1px solid #1e293b;
      overflow-y: auto;
      padding: 12px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat-num { font-size: 1.2rem; font-weight: 800; color: #38bdf8; }
    .stat-lbl { font-size: 0.75rem; color: #94a3b8; }
    .cap-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .cap-card:hover { border-color: #38bdf8; }
    .cap-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .cap-name { font-weight: 700; font-size: 0.96rem; }
    .pill {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }
    .pill-live { background: rgba(34,197,94,0.2); color: #4ade80; }
    .pill-off { background: rgba(239,68,68,0.2); color: #f87171; }
    .pill-warn { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .cap-meta { font-size: 0.8rem; color: #cbd5e1; line-height: 1.5; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>لوحة المتابعة المباشرة للكباتن</h1>
      <small id="cloudStatus">جاري الاتصال بـ JSONBin...</small>
    </div>
    <div class="controls">
      <select id="filterSelect">
        <option value="all">جميع الكباتن (14)</option>
        <option value="live">المباشرون الآن</option>
        <option value="away">غادروا الصفحة</option>
        <option value="offline">غير متصلين</option>
      </select>
      <button class="primary" id="refreshBtn" type="button">تحديث الآن</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-num" id="liveCount">0</div>
          <div class="stat-lbl">مباشر</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="awayCount">0</div>
          <div class="stat-lbl">خارج الصفحة</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="ordersCount">0</div>
          <div class="stat-lbl">طلبات متبقية</div>
        </div>
      </div>
      <div id="captainsList"></div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CONFIG = {
      binId: "6b07872413d2c8610b12db5e",
      masterKey: "$2a$10$qOS1lm7Vo1tq9r.w/vTMoOnHrSJ7MKisq.6csaRUyFQ/7vRaV4PfS",
      center: [36.3489, 43.1577],
      zoom: 12,
      pollMs: 5000
    };

    const LOCAL_KEY = "waseet_fleet_captains_v1";
    const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("waseet_fleet_channel") : null;

    const map = L.map("map").setView(CONFIG.center, CONFIG.zoom);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const markers = new Map();
    let latestCaptains = [];

    const cloudStatus = document.getElementById("cloudStatus");
    const filterSelect = document.getElementById("filterSelect");
    const refreshBtn = document.getElementById("refreshBtn");
    const captainsListEl = document.getElementById("captainsList");
    const liveCountEl = document.getElementById("liveCount");
    const awayCountEl = document.getElementById("awayCount");
    const ordersCountEl = document.getElementById("ordersCount");

    function normalizeCaptains(list) {
      const byId = new Map();
      for (let i = 1; i <= 14; i++) {
        byId.set(i, {
          id: i,
          name: `كابتن ${i}`,
          lat: CONFIG.center[0] + ((i - 7) * 0.004),
          lng: CONFIG.center[1] + (((i % 3) - 1) * 0.005),
          speed: 0,
          accuracy: 20,
          status: "offline",
          remainingOrders: 0,
          deliveredOrders: 0,
          isLive: false,
          leftPage: false,
          awaySince: null,
          lastUpdated: null
        });
      }

      if (Array.isArray(list)) {
        list.forEach(item => {
          const id = Number(item && item.id);
          if (id >= 1 && id <= 14) {
            const base = byId.get(id);
            byId.set(id, {
              ...base,
              ...item,
              id,
              name: base.name,
              lat: Number(item.lat || base.lat),
              lng: Number(item.lng || base.lng),
              speed: Number(item.speed || 0),
              remainingOrders: Number(item.remainingOrders || 0),
              deliveredOrders: Number(item.deliveredOrders || 0),
              isLive: Boolean(item.isLive),
              leftPage: Boolean(item.leftPage)
            });
          }
        });
      }
      return Array.from(byId.values());
    }

    function readLocal() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (_) {
        return [];
      }
    }

    async function fetchCloudCaptains() {
      const url = `https://api.jsonbin.io/v3/b/${encodeURIComponent(CONFIG.binId)}/latest`;
      const res = await fetch(url, {
        method: "GET",
        headers: {
          "X-Master-Key": CONFIG.masterKey
        }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const payload = json && json.record ? json.record : {};
      return Array.isArray(payload.captains) ? payload.captains : [];
    }

    function updateMarkers(captains) {
      captains.forEach(c => {
        const popupHtml = `
          <div style="text-align:right;direction:rtl;min-width:160px">
            <strong>${c.name}</strong><br/>
            الحالة: ${c.isLive ? "مباشر" : "غير متصل"}<br/>
            السرعة: ${Math.round(c.speed || 0)} كم/س<br/>
            متبقي / مسلّم: ${c.remainingOrders} / ${c.deliveredOrders}<br/>
            خارج الصفحة: ${c.leftPage ? "نعم" : "لا"}
          </div>
        `;
        if (markers.has(c.id)) {
          const m = markers.get(c.id);
          m.setLatLng([c.lat, c.lng]).setPopupContent(popupHtml);
        } else {
          const m = L.marker([c.lat, c.lng]).addTo(map).bindPopup(popupHtml);
          markers.set(c.id, m);
        }
      });
    }

    function renderUI(captains) {
      latestCaptains = normalizeCaptains(captains);
      const filter = filterSelect.value;

      const liveTotal = latestCaptains.filter(c => c.isLive).length;
      const awayTotal = latestCaptains.filter(c => c.leftPage).length;
      const ordersTotal = latestCaptains.reduce((sum, c) => sum + Number(c.remainingOrders || 0), 0);

      liveCountEl.textContent = liveTotal;
      awayCountEl.textContent = awayTotal;
      ordersCountEl.textContent = ordersTotal;

      const filtered = latestCaptains.filter(c => {
        if (filter === "live") return c.isLive;
        if (filter === "away") return c.leftPage;
        if (filter === "offline") return !c.isLive;
        return true;
      });

      captainsListEl.innerHTML = "";
      filtered.forEach(c => {
        const card = document.createElement("div");
        card.className = "cap-card";
        const pillClass = c.leftPage ? "pill-warn" : (c.isLive ? "pill-live" : "pill-off");
        const pillText = c.leftPage ? "غادر الصفحة" : (c.isLive ? "مباشر" : "غير متصل");
        const lastTime = c.lastUpdated ? new Date(c.lastUpdated).toLocaleTimeString("ar-IQ") : "—";

        card.innerHTML = `
          <div class="cap-top">
            <span class="cap-name">${c.name}</span>
            <span class="pill ${pillClass}">${pillText}</span>
          </div>
          <div class="cap-meta">
            السرعة: ${Math.round(c.speed || 0)} كم/س · متبقي: ${c.remainingOrders} · مسلّم: ${c.deliveredOrders}<br/>
            آخر تحديث: ${lastTime}
          </div>
        `;
        card.addEventListener("click", () => {
          map.setView([c.lat, c.lng], 15);
          if (markers.has(c.id)) markers.get(c.id).openPopup();
        });
        captainsListEl.appendChild(card);
      });

      updateMarkers(latestCaptains);
    }

    async function refreshAll() {
      try {
        const cloudList = await fetchCloudCaptains();
        renderUI(cloudList);
        cloudStatus.textContent = `متصل بـ JSONBin · آخر تحديث: ${new Date().toLocaleTimeString("ar-IQ")}`;
      } catch (err) {
        const localList = readLocal();
        renderUI(localList);
        cloudStatus.textContent = `وضع احتياطي محلي (${err.message})`;
      }
    }

    if (channel) {
      channel.onmessage = ev => {
        if (ev.data && Array.isArray(ev.data.captains)) {
          renderUI(ev.data.captains);
        }
      };
    }

    window.addEventListener("storage", ev => {
      if (ev.key === LOCAL_KEY) {
        renderUI(readLocal());
      }
    });

    filterSelect.addEventListener("change", () => renderUI(latestCaptains));
    refreshBtn.addEventListener("click", refreshAll);

    refreshAll();
    setInterval(refreshAll, CONFIG.pollMs);
  </script>
</body>
</html>
