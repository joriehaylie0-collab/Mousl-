<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة مندوبي الموصل</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  #top { padding:8px 12px; background:#0f766e; color:#fff; display:flex; justify-content:space-between; font-size:15px; }
  #map { flex:1; min-height:200px; }
  #list { max-height:36vh; overflow:auto; background:#fff; border-top:1px solid #ccc; }
  .it { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid #eee; font-size:14px; cursor:pointer; }
  .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .nm { flex:1; } .st { color:#555; font-size:12px; }
</style>
</head>
<body>
<div id="top"><b>📍 مندوبو الموصل</b><span id="count">...</span></div>
<div id="map"></div>
<div id="list"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
const map = L.map('map').setView(CONFIG.MAP_CENTER, 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

const markers = {};
let fitted = false;
const COLORS = { moving: '#16a34a', stopped: '#f59e0b', stale: '#9ca3af', none: '#d1d5db' };

function ago(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 1) return 'الآن';
  if (m < 60) return 'منذ ' + m + ' د';
  return 'منذ ' + Math.floor(m / 60) + ' س';
}

async function refresh() {
  let j;
  try {
    const q = new URLSearchParams({ action: 'list', key: CONFIG.KEY });
    j = await (await fetch(CONFIG.ENDPOINT + '?' + q, { cache: 'no-store' })).json();
    if (!j.ok) throw new Error(j.error);
  } catch (e) {
    document.getElementById('count').textContent = 'تعذر جلب البيانات';
    return;
  }
  const byId = {}; j.reps.forEach(r => byId[r.id] = r);
  let online = 0, html = '';

  CONFIG.REPS.forEach(rep => {
    const d = byId[rep.id];
    let key = 'none', label = 'لم يتصل بعد';
    if (d) {
      const age = j.now - d.time;
      if (age > CONFIG.STALE_MIN * 60000) { key = 'stale'; label = 'منقطع ' + ago(age); }
      else { key = d.status === 'moving' ? 'moving' : 'stopped'; online++;
             label = (key === 'moving' ? 'متحرك' : 'متوقف') + ' · ' + ago(age); }
      if (d.sim) label += ' (تجريبي)';

      const pop = `<b>${rep.name}</b><br>${label}` + (d.bat !== '' ? `<br>البطارية: ${d.bat}%` : '');
      if (markers[rep.id]) {
        markers[rep.id].setLatLng([d.lat, d.lng])
          .setStyle({ color: COLORS[key], fillColor: COLORS[key] }).setPopupContent(pop);
      } else {
        markers[rep.id] = L.circleMarker([d.lat, d.lng],
          { radius: 11, color: COLORS[key], fillColor: COLORS[key], fillOpacity: .85 })
          .addTo(map).bindPopup(pop)
          .bindTooltip(String(rep.id), { permanent: true, direction: 'center', className: 'lbl' });
      }
    }
    html += `<div class="it" data-id="${rep.id}"><span class="dot" style="background:${COLORS[key]}"></span>` +
            `<span class="nm">${rep.name}</span><span class="st">${label}</span></div>`;
  });

  document.getElementById('list').innerHTML = html;
  document.getElementById('count').textContent = `المتصلون الآن: ${online} / ${CONFIG.REPS.length}`;

  const pts = Object.values(markers).map(m => m.getLatLng());
  if (!fitted && pts.length) { map.fitBounds(L.latLngBounds(pts).pad(0.3)); fitted = true; }
}

document.getElementById('list').onclick = e => {
  const it = e.target.closest('.it'); if (!it) return;
  const m = markers[it.dataset.id];
  if (m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); }
};

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
