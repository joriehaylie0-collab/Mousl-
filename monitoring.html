<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الوسيط — متابعة الكابتن المباشرة</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; }
    body {
      margin: 0;
      background: #070b14;
      color: #f1f5f9;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }
    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.05rem; color: #34d399; }
    .sub { font-size: 0.78rem; color: #94a3b8; }
    button {
      background: #10b981;
      color: #052e16;
      border: none;
      border-radius: 9px;
      padding: 8px 13px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 0;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    }
    .side {
      background: #0f172a;
      border-left: 1px solid #1e293b;
      padding: 14px;
      overflow-y: auto;
    }
    .card {
      background: #080d19;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px;
    }
    .cap-title { font-size: 1rem; font-weight: 800; margin-bottom: 6px; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .b-live { background: rgba(16,185,129,0.16); color: #34d399; }
    .b-away { background: rgba(245,158,11,0.16); color: #fbbf24; }
    .b-off { background: rgba(239,68,68,0.16); color: #f87171; }
    .row-line { font-size: 0.84rem; color: #cbd5e1; line-height: 1.7; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>الوسيط — شاشة المتابعة المباشرة</h1>
      <div class="sub" id="localStatus">جاري المزامنة المستمرة مع JSONBin...</div>
    </div>
    <button type="button" id="refreshBtn">تحديث الآن</button>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="card">
        <div class="cap-title" id="capName">كابتن الاستلام مصطفى محمد</div>
        <span class="badge b-off" id="capBadge">غير متصل</span>
        <div class="row-line" id="capDetails">بانتظار أول إرسال مباشر...</div>
      </div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CONFIG = {
      binId: "6b07872413d2c8610b12db5e",
      masterKey: "$2a$10$qOS1lm7Vo1tq9r.w/vTMoOnHrSJ7MKisq.6csaRUyFQ/7vRaV4PfS",
      captainId: 1,
      defaultName: "كابتن الاستلام مصطفى محمد",
      center: [36.3489, 43.1577],
      pollMs: 3000
    };

    const LOCAL_KEY = "waseet_fleet_captains_v1";
    const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("waseet_fleet_channel") : null;

    const map = L.map("map").setView(CONFIG.center, 14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let marker = L.marker(CONFIG.center).addTo(map);
    let hasCenteredOnce = false;

    const localStatus = document.getElementById("localStatus");
    const refreshBtn = document.getElementById("refreshBtn");
    const capNameEl = document.getElementById("capName");
    const capBadgeEl = document.getElementById("capBadge");
    const capDetailsEl = document.getElementById("capDetails");

    function statusArabic(st) {
      if (st === "on_way") return "في الطريق";
      if (st === "stopped") return "متوقف";
      return "غير متصل";
    }

    function pickCaptain(list) {
      if (!Array.isArray(list)) return null;
      return list.find(x => Number(x && x.id) === CONFIG.captainId) || list[0] || null;
    }

    function readLocal() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return pickCaptain(arr);
      } catch (_) {
        return null;
      }
    }

    async function fetchCloud() {
      const url = `https://api.jsonbin.io/v3/b/${encodeURIComponent(CONFIG.binId)}/latest`;
      const res = await fetch(url, {
        method: "GET",
        headers: { "X-Master-Key": CONFIG.masterKey }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const captains = (json && json.record && Array.isArray(json.record.captains)) ? json.record.captains : [];
      return pickCaptain(captains);
    }

    function renderCaptain(rec, sourceLabel) {
      const data = rec || {
        name: CONFIG.defaultName,
        lat: CONFIG.center[0],
        lng: CONFIG.center[1],
        speed: 0,
        status: "offline",
        remainingOrders: 0,
        deliveredOrders: 0,
        isLive: false,
        leftPage: false,
        accuracy: null,
        lastUpdated: null
      };

      const name = (data.name && String(data.name).trim()) ? String(data.name).trim() : CONFIG.defaultName;
      const lat = Number(data.lat || CONFIG.center[0]);
      const lng = Number(data.lng || CONFIG.center[1]);
      const accText = (typeof data.accuracy === "number" && !Number.isNaN(data.accuracy))
        ? `±${Math.round(data.accuracy)}م`
        : "—";

      capNameEl.textContent = name;
      if (data.leftPage && data.isLive) {
        capBadgeEl.textContent = "غادر الصفحة";
        capBadgeEl.className = "badge b-away";
      } else if (data.isLive) {
        capBadgeEl.textContent = "مباشر";
        capBadgeEl.className = "badge b-live";
      } else {
        capBadgeEl.textContent = "غير متصل";
        capBadgeEl.className = "badge b-off";
      }

      const timeStr = data.lastUpdated ? new Date(data.lastUpdated).toLocaleTimeString("ar-IQ") : "—";
      capDetailsEl.innerHTML = `
        حالة العمل: <strong>${statusArabic(data.status)}</strong><br/>
        السرعة: <strong>${Math.round(data.speed || 0)} كم/س</strong> · الدقة: <strong>${accText}</strong><br/>
        الطلبات المتبقية: <strong>${Number(data.remainingOrders || 0)}</strong> · المسلّمة: <strong>${Number(data.deliveredOrders || 0)}</strong><br/>
        الإحداثيات: <strong>${lat.toFixed(6)}, ${lng.toFixed(6)}</strong><br/>
        آخر تحديث: <strong>${timeStr}</strong>
      `;

      marker.setLatLng([lat, lng]).bindPopup(`<strong>${name}</strong><br/>${statusArabic(data.status)} · دقة ${accText}`);
      if (!hasCenteredOnce && data.lastUpdated) {
        map.setView([lat, lng], 15);
        hasCenteredOnce = true;
      }
      localStatus.textContent = `${sourceLabel || "متصل بـ JSONBin"} · آخر فحص: ${new Date().toLocaleTimeString("ar-IQ")}`;
    }

    async function syncLoop() {
      try {
        const cloudRec = await fetchCloud();
        renderCaptain(cloudRec, "متصل بـ JSONBin");
      } catch (err) {
        renderCaptain(readLocal(), `وضع محلي (${err.message})`);
      }
    }

    if (channel) {
      channel.onmessage = ev => {
        if (ev.data && Array.isArray(ev.data.captains)) {
          renderCaptain(pickCaptain(ev.data.captains), "تحديث فوري");
        }
      };
    }

    window.addEventListener("storage", ev => {
      if (ev.key === LOCAL_KEY) renderCaptain(readLocal(), "تحديث محلي");
    });

    refreshBtn.addEventListener("click", syncLoop);
    syncLoop();
    setInterval(syncLoop, CONFIG.pollMs);
  </script>
</body>
</html>
