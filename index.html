<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة الكابتن - متابعة الحركة المباشرة</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      max-width: 540px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 6px; font-size: 1.3rem; color: #38bdf8; }
    .subtitle { margin: 0 0 18px; font-size: 0.9rem; color: #94a3b8; }
    label { display: block; font-size: 0.88rem; margin-bottom: 6px; color: #cbd5e1; }
    select, input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
      margin-bottom: 14px;
    }
    input[readonly], .locked-field {
      background: #131c2e;
      color: #e2e8f0;
      border-color: #334155;
      cursor: not-allowed;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    button {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.92; }
    .btn-start { background: #16a34a; color: #fff; }
    .btn-stop { background: #dc2626; color: #fff; }
    .status-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 0.88rem;
      line-height: 1.65;
    }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .live { background: rgba(22,163,74,0.2); color: #4ade80; }
    .offline { background: rgba(239,68,68,0.2); color: #f87171; }
    .sync-ok { color: #38bdf8; }
    .sync-err { color: #fbbf24; }
  </style>
</head>
<body>
  <div class="card">
    <h1>واجهة الكابتن المباشرة</h1>
    <p class="subtitle">اسم الكابتن ثابت وغير قابل للتعديل من قبل الكابتن</p>

    <div class="row">
      <div>
        <label for="captainSlotSelect">اختر الكابتن</label>
        <select id="captainSlotSelect"></select>
      </div>
      <div>
        <label for="captainLockedName">اسم الكابتن (ثابت)</label>
        <input id="captainLockedName" type="text" class="locked-field" readonly aria-readonly="true" />
      </div>
    </div>

    <label for="statusSelect">حالة العمل</label>
    <select id="statusSelect">
      <option value="active">نشط في التوصيل</option>
      <option value="break">استراحة قصيرة</option>
      <option value="delayed">تأخير / ازدحام</option>
      <option value="offline">غير متصل</option>
    </select>

    <div class="row">
      <div>
        <label for="remainingOrders">الطلبات المتبقية</label>
        <input id="remainingOrders" type="number" min="0" value="0" />
      </div>
      <div>
        <label for="deliveredOrders">الطلبات المسلّمة</label>
        <input id="deliveredOrders" type="number" min="0" value="0" />
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-start" id="startBtn" type="button">بدء البث المباشر</button>
      <button class="btn-stop" id="stopBtn" type="button">إيقاف البث</button>
    </div>

    <div class="status-box" id="statusBox">
      الحالة: <span class="badge offline" id="liveBadge">متوقف</span><br />
      الكابتن: <span id="activeNameText">—</span><br />
      الإحداثيات: <span id="coordsText">بانتظار تحديد الموقع...</span><br />
      المزامنة السحابية: <span id="syncText" class="sync-ok">جاهز</span>
    </div>
  </div>

  <script>
    const CONFIG = {
      binId: "6b07872413d2c8610b12db5e",
      masterKey: "$2a$10$qOS1lm7Vo1tq9r.w/vTMoOnHrSJ7MKisq.6csaRUyFQ/7vRaV4PfS",
      defaultCenter: { lat: 36.3489, lng: 43.1577 }, // الموصل
      pollIntervalMs: 5000
    };

    // أسماء الكباتن الثابتة (14 كابتن) - غير قابلة للتعديل من الواجهة
    const CAPTAINS = Array.from({ length: 14 }, (_, idx) => ({
      id: idx + 1,
      name: `كابتن ${idx + 1}`
    }));

    const LOCAL_KEY = "waseet_fleet_captains_v1";
    const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("waseet_fleet_channel") : null;

    const captainSlotSelect = document.getElementById("captainSlotSelect");
    const captainLockedName = document.getElementById("captainLockedName");
    const statusSelect = document.getElementById("statusSelect");
    const remainingInput = document.getElementById("remainingOrders");
    const deliveredInput = document.getElementById("deliveredOrders");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const liveBadge = document.getElementById("liveBadge");
    const activeNameText = document.getElementById("activeNameText");
    const coordsText = document.getElementById("coordsText");
    const syncText = document.getElementById("syncText");

    let watchId = null;
    let heartbeatTimer = null;
    let isStreaming = false;
    let currentRecord = null;

    function getSelectedCaptain() {
      const id = Number(captainSlotSelect.value);
      return CAPTAINS.find(c => c.id === id) || { id, name: `كابتن ${id}` };
    }

    function syncLockedCaptainDisplay() {
      const cap = getSelectedCaptain();
      captainLockedName.value = cap.name;
      activeNameText.textContent = cap.name;
    }

    function initSlots() {
      CAPTAINS.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = `رقم ${c.id}`;
        captainSlotSelect.appendChild(opt);
      });
      syncLockedCaptainDisplay();
    }

    function readLocalCaptains() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function writeLocalCaptains(list) {
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
        if (channel) channel.postMessage({ type: "update", captains: list });
      } catch (_) {}
    }

    function upsertLocalCaptain(record) {
      const list = readLocalCaptains();
      const idx = list.findIndex(item => Number(item.id) === Number(record.id));
      if (idx >= 0) list[idx] = record;
      else list.push(record);
      writeLocalCaptains(list);
      return list;
    }

    async function syncToCloud(record) {
      syncText.className = "sync-ok";
      syncText.textContent = "جاري الإرسال إلى JSONBin...";
      const url = `https://api.jsonbin.io/v3/b/${encodeURIComponent(CONFIG.binId)}`;

      try {
        let remoteList = [];
        const getRes = await fetch(`${url}/latest`, {
          method: "GET",
          headers: {
            "X-Master-Key": CONFIG.masterKey
          }
        });

        if (getRes.ok) {
          const json = await getRes.json();
          const payload = json && json.record ? json.record : {};
          if (Array.isArray(payload.captains)) {
            remoteList = payload.captains;
          }
        }

        const idx = remoteList.findIndex(item => Number(item.id) === Number(record.id));
        if (idx >= 0) remoteList[idx] = record;
        else remoteList.push(record);

        const putRes = await fetch(url, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": CONFIG.masterKey
          },
          body: JSON.stringify({ captains: remoteList })
        });

        if (!putRes.ok) {
          throw new Error(`HTTP ${putRes.status}`);
        }

        syncText.className = "sync-ok";
        syncText.textContent = `تمت المزامنة (${new Date().toLocaleTimeString("ar-IQ")})`;
      } catch (err) {
        syncText.className = "sync-err";
        syncText.textContent = `تعذر الإرسال السحابي (${err.message}) — محفوظ محلياً`;
      }
    }

    function buildRecord(lat, lng, speed, accuracy, liveFlag, leftFlag) {
      const cap = getSelectedCaptain();
      const prev = currentRecord && Number(currentRecord.id) === cap.id ? currentRecord : null;

      return {
        id: cap.id,
        name: cap.name,
        lat: Number(lat),
        lng: Number(lng),
        speed: Number(speed || 0),
        accuracy: Number(accuracy || 15),
        status: liveFlag ? statusSelect.value : "offline",
        remainingOrders: Number(remainingInput.value || 0),
        deliveredOrders: Number(deliveredInput.value || 0),
        isLive: Boolean(liveFlag),
        leftPage: Boolean(leftFlag),
        awaySince: leftFlag ? (prev && prev.awaySince ? prev.awaySince : new Date().toISOString()) : null,
        lastUpdated: new Date().toISOString()
      };
    }

    async function pushUpdate(lat, lng, speed, accuracy, liveFlag, leftFlag) {
      const rec = buildRecord(lat, lng, speed, accuracy, liveFlag, leftFlag);
      currentRecord = rec;
      upsertLocalCaptain(rec);
      coordsText.textContent = `${rec.lat.toFixed(5)}, ${rec.lng.toFixed(5)} (دقة ${Math.round(rec.accuracy)}م)`;
      await syncToCloud(rec);
    }

    function startStreaming() {
      isStreaming = true;
      liveBadge.textContent = "مباشر";
      liveBadge.className = "badge live";

      const fallbackLat = currentRecord ? currentRecord.lat : CONFIG.defaultCenter.lat;
      const fallbackLng = currentRecord ? currentRecord.lng : CONFIG.defaultCenter.lng;
      pushUpdate(fallbackLat, fallbackLng, 0, 20, true, document.hidden);

      if ("geolocation" in navigator) {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(
          pos => {
            const { latitude, longitude, speed, accuracy } = pos.coords;
            pushUpdate(latitude, longitude, speed ? speed * 3.6 : 0, accuracy, isStreaming, document.hidden);
          },
          () => {
            pushUpdate(fallbackLat, fallbackLng, 0, 30, isStreaming, document.hidden);
          },
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
        );
      }

      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (!isStreaming) return;
        const lat = currentRecord ? currentRecord.lat : CONFIG.defaultCenter.lat;
        const lng = currentRecord ? currentRecord.lng : CONFIG.defaultCenter.lng;
        const spd = currentRecord ? currentRecord.speed : 0;
        const acc = currentRecord ? currentRecord.accuracy : 15;
        pushUpdate(lat, lng, spd, acc, true, document.hidden);
      }, CONFIG.pollIntervalMs);
    }

    function stopStreaming() {
      isStreaming = false;
      liveBadge.textContent = "متوقف";
      liveBadge.className = "badge offline";
      if (watchId !== null && "geolocation" in navigator) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
      const lat = currentRecord ? currentRecord.lat : CONFIG.defaultCenter.lat;
      const lng = currentRecord ? currentRecord.lng : CONFIG.defaultCenter.lng;
      pushUpdate(lat, lng, 0, 15, false, false);
    }

    captainSlotSelect.addEventListener("change", syncLockedCaptainDisplay);

    document.addEventListener("visibilitychange", () => {
      if (!isStreaming || !currentRecord) return;
      pushUpdate(
        currentRecord.lat,
        currentRecord.lng,
        currentRecord.speed,
        currentRecord.accuracy,
        true,
        document.hidden
      );
    });

    startBtn.addEventListener("click", startStreaming);
    stopBtn.addEventListener("click", stopStreaming);

    initSlots();
  </script>
</body>
</html>
